scrape_configs:
  - job_name: 'otel-collector'
    scrape_interval: 5s
    static_configs:
      - targets: ['otel-collector:9090']

  - job_name: 'golang-app'
    scrape_interval: 5s
    static_configs:
      - targets: ['172.25.160.1:7070'] 
